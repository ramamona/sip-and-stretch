name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: make test

      # With the macOS 27 SDK, @State is a macro whose plugin ships only with Xcode, so using it
      # breaks builds on machines with just the Command Line Tools. Use @ViewState instead.
      - name: No @State (use @ViewState)
        run: "! grep -rnE '^[[:space:]]*@State\\b' Sources"

      - name: Bundle app
        run: make app

      - name: Zip app
        run: ditto -c -k --keepParent build/SipStretch.app SipStretch.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: SipStretch-${{ github.sha }}
          path: SipStretch.zip
          if-no-files-found: error
